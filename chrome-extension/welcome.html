<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMS 麥克風權限</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #15294a 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px; padding: 48px 40px; text-align: center;
      max-width: 420px; width: 90%;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 32px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      font-size: 18px; font-weight: 600;
      color: #fff; background: #17a2b8;
      border: none; border-radius: 12px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #138496; }
    .status { margin-top: 24px; font-size: 15px; min-height: 24px; }
    .status.success { color: #48bb78; }
    .status.error { color: #fc8181; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎤 麥克風權限</h1>
    <p>為了讓 OpenCLAW 語音輸入功能正常運作，<br>需要您授予麥克風存取權限。</p>
    <button id="grantBtn" class="btn">允許麥克風權限</button>
    <div id="status" class="status"></div>
  </div>
  <script src="welcome.js"></script>
</body>
</html>
