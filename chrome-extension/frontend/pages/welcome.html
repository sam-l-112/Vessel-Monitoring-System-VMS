<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMS 麥克風授權</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #15294a 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 20px; padding: 48px 40px; text-align: center;
      max-width: 420px; width: 90%;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 16px; font-weight: 600;
      color: #fff; background: #e53e3e;
      border: none; border-radius: 12px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #c53030; }
    .btn.done { background: #38a169; }
    .btn.done:hover { background: #2f855a; }
    .status { margin-top: 24px; font-size: 14px; min-height: 22px; line-height: 1.5; }
    .status.success { color: #48bb78; }
    .status.error { color: #fc8181; }
    .hint { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎤 麥克風授權</h1>
    <p id="msg">點擊下方按鈕，允許瀏覽器使用麥克風。<br>授權後請關閉此頁面，回到儀表板使用語音輸入。</p>
    <button id="grantBtn" class="btn">允許麥克風權限</button>
    <div id="status" class="status"></div>
    <div class="hint">或使用 Chrome Extension 側邊欄直接取得權限</div>
  </div>
  <script src="../js/welcome.js"></script>
</body>
</html>
