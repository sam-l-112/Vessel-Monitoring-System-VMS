<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="示警系統 - VMS 養殖監控系統">
    <meta name="keywords" content="示警系統,警報,養殖監控">
    <meta name="author" content="VMS Team">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/Alarm_system.css">
    <link rel="stylesheet" href="/css/Dashboard.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>警報通知 - VMS 養殖監控系統</title>
</head>
<body>
    <div id="app">
        <div class="container-fluid">
            <div class="row">
                <div class="col-auto px-0">
                    <div class="sidebar d-flex flex-column py-3" :class="{ show: sidebarVisible }">
                        <div class="text-center mb-4 px-3">
                            <h5 class="text-white fw-bold"><i class="fas fa-fish me-2"></i>VMS</h5>
                            <small class="text-white-50">養殖監控系統</small>
                        </div>
                        <hr class="text-white-50 mx-3 my-2">
                        <ul class="nav flex-column px-2">
                            <li class="nav-item">
                                <a class="nav-link" href="dashboard.html"><i class="fas fa-chart-pie"></i> 儀表板</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="Alarm_system.html"><i class="fas fa-bell"></i> 示警系統</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="fish_data.html"><i class="fas fa-fish"></i> 魚類數據</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="Feed_Control.html"><i class="fas fa-utensils"></i> 飼料管理</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="Data_Analytics.html"><i class="fas fa-chart-line"></i> 數據分析</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="CWA_WI.html"><i class="fas fa-cloud-sun"></i> 天氣資訊</a>
                            </li>
                        </ul>
                        <hr class="text-white-50 mx-3 my-2">
                        <div class="mt-auto px-3">
                            <button class="btn btn-outline-light w-100 btn-sm" @click="logout">
                                <i class="fas fa-sign-out-alt me-1"></i> 登出
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col ps-0">
                    <div class="main-content p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <button class="btn btn-outline-primary d-md-none" @click="toggleSidebar">
                                <i class="fas fa-bars"></i>
                            </button>
                            <div>
                                <h4 class="mb-0 fw-bold"><i class="fas fa-bell text-danger me-2"></i>警報通知</h4>
                                <small class="text-muted">即時監控養殖環境異常狀態</small>
                            </div>
                            <button class="btn btn-primary btn-sm" @click="refreshData">
                                <i class="fas fa-sync-alt me-1"></i> 重新整理
                            </button>
                        </div>

                        <div v-if="loading" class="text-center py-5">
                            <div class="loading-spinner mx-auto mb-3"></div>
                            <p class="text-muted">載入中...</p>
                        </div>

                        <div v-if="error" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> {{ error }}
                        </div>

                        <template v-if="!loading">
                            <div class="alert-header">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <h2><i class="fas fa-shield-alt me-2"></i>示警類型總覽</h2>
                                        <p>系統共監控 {{ alertTypes.length }} 種示警類型，目前 {{ criticalCount }} 個嚴重警報</p>
                                    </div>
                                    <div class="col-md-4 text-md-end">
                                        <div class="d-flex justify-content-end gap-2">
                                            <span class="badge bg-danger fs-6">{{ criticalCount }}</span>
                                            <span class="badge bg-warning text-dark fs-6">{{ highCount }}</span>
                                            <span class="badge bg-primary fs-6">{{ mediumCount }}</span>
                                            <span class="badge bg-success fs-6">{{ lowCount }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="alert-stats-grid">
                                <div class="card metric-card alert-total">
                                    <div class="card-body">
                                        <h5>總示警類型</h5>
                                        <h2>{{ alertTypes.length }}</h2>
                                    </div>
                                </div>
                                <div class="card metric-card alert-critical">
                                    <div class="card-body">
                                        <h5>嚴重</h5>
                                        <h2>{{ criticalCount }}</h2>
                                    </div>
                                </div>
                                <div class="card metric-card alert-high">
                                    <div class="card-body">
                                        <h5>高度</h5>
                                        <h2>{{ highCount }}</h2>
                                    </div>
                                </div>
                                <div class="card metric-card alert-medium">
                                    <div class="card-body">
                                        <h5>中度</h5>
                                        <h2>{{ mediumCount }}</h2>
                                    </div>
                                </div>
                                <div class="card metric-card alert-low">
                                    <div class="card-body">
                                        <h5>低度</h5>
                                        <h2>{{ lowCount }}</h2>
                                    </div>
                                </div>
                            </div>

                            <div class="filter-bar">
                                <div class="row g-2 align-items-center">
                                    <div class="col-md-3">
                                        <select class="form-select" v-model="severityFilter">
                                            <option value="">全部 severity</option>
                                            <option value="critical">嚴重 (critical)</option>
                                            <option value="high">高度 (high)</option>
                                            <option value="medium">中度 (medium)</option>
                                            <option value="low">低度 (low)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <input type="text" class="form-control" placeholder="搜尋示警類型..." v-model="searchQuery">
                                    </div>
                                    <div class="col-md-2">
                                        <select class="form-select" v-model="pageSize">
                                            <option :value="5">5 筆</option>
                                            <option :value="10">10 筆</option>
                                            <option :value="20">20 筆</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 text-md-end">
                                        <small class="text-muted">共 {{ filteredTypes.length }} 筆</small>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-8">
                                    <div class="card">
                                        <div class="card-header bg-white py-3">
                                            <h5 class="mb-0 fw-bold"><i class="fas fa-list me-2 text-primary"></i>示警類型清單</h5>
                                        </div>
                                        <div class="card-body p-0">
                                            <div v-if="paginatedTypes.length === 0" class="empty-state">
                                                <i class="fas fa-check-circle text-success"></i>
                                                <h4>無符合條件的示警類型</h4>
                                                <p>嘗試調整篩選條件</p>
                                            </div>
                                            <div v-for="(alert, index) in paginatedTypes" :key="alert.id" :class="'alert-card severity-' + alert.severity + ' p-3 border-bottom'" style="cursor:pointer">
                                                <div class="d-flex justify-content-between align-items-start">
                                                    <div class="flex-grow-1">
                                                        <div class="d-flex align-items-center gap-2 mb-1">
                                                            <span :class="'severity-badge severity-' + alert.severity">{{ alert.severity }}</span>
                                                            <h6 class="mb-0 fw-bold">{{ alert.name }}</h6>
                                                        </div>
                                                        <p class="alert-description mb-0">{{ alert.description }}</p>
                                                    </div>
                                                    <small class="text-muted ms-2">#{{ alert.id }}</small>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="card-footer bg-white d-flex justify-content-between align-items-center" v-if="totalPages > 1">
                                            <small class="text-muted">第 {{ currentPage }} / {{ totalPages }} 頁</small>
                                            <nav>
                                                <ul class="pagination pagination-sm mb-0">
                                                    <li class="page-item" :class="{ disabled: currentPage <= 1 }">
                                                        <button class="page-link" @click="currentPage--">&laquo;</button>
                                                    </li>
                                                    <li class="page-item" v-for="p in totalPages" :key="p" :class="{ active: p === currentPage }">
                                                        <button class="page-link" @click="currentPage = p">{{ p }}</button>
                                                    </li>
                                                    <li class="page-item" :class="{ disabled: currentPage >= totalPages }">
                                                        <button class="page-link" @click="currentPage++">&raquo;</button>
                                                    </li>
                                                </ul>
                                            </nav>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-4">
                                    <div class="card mb-3">
                                        <div class="card-header bg-white py-3">
                                            <h5 class="mb-0 fw-bold"><i class="fas fa-chart-pie me-2 text-primary"></i>severity 分佈</h5>
                                        </div>
                                        <div class="card-body">
                                            <canvas id="severityChart" height="250"></canvas>
                                        </div>
                                    </div>

                                    <div class="card">
                                        <div class="card-header bg-white py-3">
                                            <h5 class="mb-0 fw-bold"><i class="fas fa-clock me-2 text-primary"></i>最近活動</h5>
                                        </div>
                                        <div class="card-body p-3">
                                            <div v-if="recentActivities.length === 0" class="text-center text-muted py-3">
                                                <small>暫無活動記錄</small>
                                            </div>
                                            <div v-for="activity in recentActivities" :key="activity.id" class="d-flex align-items-start gap-2 mb-2 pb-2 border-bottom">
                                                <div class="activity-icon mt-1">
                                                    <span :class="'badge severity-' + activity.severity">{{ activity.severity }}</span>
                                                </div>
                                                <div class="flex-grow-1">
                                                    <small class="fw-bold d-block">{{ activity.name }}</small>
                                                    <small class="text-muted">{{ activity.time }}</small>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row mt-4">
                                <div class="col-12">
                                    <div class="card">
                                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                            <h5 class="mb-0 fw-bold"><i class="fas fa-satellite me-2 text-danger"></i>NCDR 災防示警即時訊息</h5>
                                            <small class="text-muted">{{ filteredMessages.length }} 筆訊息</small>
                                        </div>
                                        <div class="card-body p-0">
                                            <div v-if="alertMessagesLoading" class="text-center py-4">
                                                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                                                <small class="ms-2 text-muted">載入 NCDR 示警訊息中...</small>
                                            </div>
                                            <div v-else-if="alertMessagesError" class="error-message m-3">
                                                <i class="fas fa-exclamation-triangle"></i> {{ alertMessagesError }}
                                            </div>
                                            <div v-else>
                                                <div class="filter-bar mx-3 mt-3 mb-0">
                                                    <div class="row g-2 align-items-center">
                                                        <div class="col-md-3">
                                                            <input type="text" class="form-control form-control-sm" placeholder="行政區代碼..." v-model="ncdrCountyCode">
                                                        </div>
                                                        <div class="col-md-3">
                                                            <input type="text" class="form-control form-control-sm" placeholder="示警代碼 (capCode)..." v-model="ncdrCapCode">
                                                        </div>
                                                        <div class="col-md-2">
                                                            <select class="form-select form-select-sm" v-model="ncdrPageSize">
                                                                <option :value="5">5 筆</option>
                                                                <option :value="10">10 筆</option>
                                                                <option :value="25">25 筆</option>
                                                            </select>
                                                        </div>
                                                        <div class="col-md-4 text-md-end">
                                                            <button class="btn btn-sm btn-outline-danger" @click="loadAlertMessages">
                                                                <i class="fas fa-sync-alt me-1"></i>重新取得
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div v-if="filteredMessages.length === 0" class="empty-state">
                                                    <i class="fas fa-check-circle text-success"></i>
                                                    <h4>暫無示警訊息</h4>
                                                    <p>目前沒有符合條件的 NCDR 災防示警訊息</p>
                                                </div>

                                                <div v-else class="table-responsive">
                                                    <table class="table table-hover mb-0">
                                                        <thead>
                                                            <tr>
                                                                <th style="width:140px">發送時間</th>
                                                                <th style="width:80px">類型</th>
                                                                <th>標題</th>
                                                                <th style="width:70px">severity</th>
                                                                <th style="width:70px">緊急度</th>
                                                                <th style="width:100px">地區</th>
                                                                <th style="width:50px"></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template v-for="msg in paginatedMessages" :key="msg.id">
                                                                <tr :class="'alert-card ' + getSeverityClass(msg.severity)" style="cursor:pointer" @click="toggleExpand(msg)">
                                                                    <td><small>{{ formatSentTime(msg.sent) }}</small></td>
                                                                    <td><small>{{ msg.category || msg.msgType || '-' }}</small></td>
                                                                    <td><small class="fw-bold">{{ msg.headline || msg.event || '-' }}</small></td>
                                                                    <td><span :class="'severity-badge ' + getSeverityClass(msg.severity)">{{ getSeverityLabel(msg.severity) }}</span></td>
                                                                    <td><small>{{ getUrgencyLabel(msg.urgency) }}</small></td>
                                                                    <td><small>{{ getAlertAreas(msg).slice(0, 2).map(a => a.areaDesc).join(', ') || '-' }}</small></td>
                                                                    <td><i :class="expandedAlert === msg.id ? 'fas fa-chevron-up text-muted' : 'fas fa-chevron-down text-muted'"></i></td>
                                                                </tr>
                                                                <tr v-if="expandedAlert === msg.id">
                                                                    <td colspan="7" class="bg-light p-3">
                                                                        <div class="row">
                                                                            <div class="col-md-8">
                                                                                <h6 class="fw-bold mb-2">{{ msg.headline || msg.event }}</h6>
                                                                                <p class="mb-2" style="white-space:pre-wrap">{{ msg.description }}</p>
                                                                                <div v-if="msg.instruction" class="alert alert-warning p-2 mb-0">
                                                                                    <i class="fas fa-exclamation-circle me-1"></i>
                                                                                    <strong>應變指引：</strong>{{ msg.instruction }}
                                                                                </div>
                                                                            </div>
                                                                            <div class="col-md-4">
                                                                                <small class="text-muted d-block"><strong>發送單位：</strong>{{ msg.sender || '-' }}</small>
                                                                                <small class="text-muted d-block"><strong>示警代碼：</strong>{{ msg.capCode || '-' }}</small>
                                                                                <small class="text-muted d-block"><strong>確定性：</strong>{{ msg.certainty || '-' }}</small>
                                                                                <small class="text-muted d-block"><strong>影響地區：</strong>{{ getAlertAreas(msg).map(a => a.areaDesc).join('、') || '-' }}</small>
                                                                                <small v-if="msg.web" class="text-muted d-block">
                                                                                    <strong>參考連結：</strong>
                                                                                    <a :href="msg.web" target="_blank" class="text-primary">{{ msg.web }}</a>
                                                                                </small>
                                                                            </div>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                            <div class="row mt-4">
                                <div class="col-12">
                                    <div class="card">
                                        <div class="card-header bg-white py-3">
                                            <ul class="nav nav-tabs card-header-tabs" role="tablist">
                                                <li class="nav-item"><a class="nav-link" :class="{ active: cwaTab === 'typhoon' }" href="#" @click.prevent="switchCWATab('typhoon')"><i class="fas fa-wind me-1"></i>颱風警報</a></li>
                                                <li class="nav-item"><a class="nav-link" :class="{ active: cwaTab === 'hightemp' }" href="#" @click.prevent="switchCWATab('hightemp')"><i class="fas fa-temperature-high me-1"></i>高溫資訊</a></li>
                                                <li class="nav-item"><a class="nav-link" :class="{ active: cwaTab === 'tsunami' }" href="#" @click.prevent="switchCWATab('tsunami')"><i class="fas fa-water me-1"></i>海嘯資訊</a></li>
                                                <li class="nav-item"><a class="nav-link" :class="{ active: cwaTab === 'station' }" href="#" @click.prevent="switchCWATab('station')"><i class="fas fa-broadcast-tower me-1"></i>觀測資料</a></li>
                                            </ul>
                                        </div>
                                        <div class="card-body p-0">
                                            <div v-if="cwaLoading" class="text-center py-4"><div class="spinner-border text-warning spinner-border-sm"></div><small class="ms-2 text-muted">載入 CWA 氣象警報中...</small></div>
                                            <div v-else-if="cwaError" class="alert alert-warning m-3"><i class="fas fa-exclamation-triangle"></i> {{ cwaError }}</div>
                                            <div v-else-if="cwaAlerts.length === 0" class="empty-state"><i class="fas fa-check-circle text-success"></i><h4>暫無警報</h4><p>目前無 {{ cwaTabLabel(cwaTab) }} 資料</p></div>
                                            <div v-else>
                                                <div v-for="(a, i) in cwaAlerts" :key="i" class="p-3 border-bottom">
                                                    <div class="d-flex align-items-start gap-2 mb-2">
                                                        <span v-if="a._severity" :class="'severity-badge ' + getSeverityClass(a._severity)">{{ getSeverityLabel(a._severity) }}</span>
                                                        <span v-if="a.category" class="badge bg-secondary me-1">{{ a.category }}</span>
                                                        <strong class="flex-grow-1">{{ a._headline || a.event || '-' }}</strong>
                                                        <small v-if="a._effective" class="text-muted">{{ formatSentTime(a._effective) }}</small>
                                                    </div>
                                                    <p class="mb-1 small text-muted" style="white-space:pre-wrap">{{ a.description || a.ReportContent || a.Content || '' }}</p>
                                                    <div class="d-flex flex-wrap gap-3">
                                                        <small v-if="a._areaStr" class="text-muted"><i class="fas fa-map-marker-alt me-1"></i>{{ a._areaStr }}</small>
                                                        <small v-if="a.senderName" class="text-muted"><i class="fas fa-building me-1"></i>{{ a.senderName }}</small>
                                                        <small v-if="a.web" class="text-primary"><a :href="a.web" target="_blank"><i class="fas fa-external-link-alt me-1"></i>參考連結</a></small>
                                                    </div>
                                                    <div v-if="a.instruction" class="alert alert-warning p-2 mt-2 mb-0 small"><i class="fas fa-info-circle me-1"></i>{{ a.instruction }}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/Alarm_system.js"></script>
</body>
</html>
